<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyNotes — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand"><div class="mark">📝</div><h1>MyNotes</h1></div>
    <p class="tagline">Organize your thoughts, ideas, and tasks in one place.</p>

    <div class="auth-heading">
      <h2>Welcome back!</h2>
      <p>Log in to pick up right where you left off.</p>
    </div>

    <div class="error-msg" id="errMsg"></div>
    <div class="success-msg" id="okMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="auth-links">
      <a href="forgot-password.html">Forgot Password?</a>
      <a href="register.html">Register Here</a>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script>
  // If already logged in, go straight to dashboard
  if(DB.getSession() && DB.currentUser()){ window.location.href = 'dashboard.html'; }

  const params = new URLSearchParams(window.location.search);
  if(params.get('registered') === '1'){
    const ok = document.getElementById('okMsg');
    ok.textContent = 'Account created! Please log in.';
    ok.style.display = 'block';
  }
  if(params.get('reset') === '1'){
    const ok = document.getElementById('okMsg');
    ok.textContent = 'Password updated! Please log in with your new password.';
    ok.style.display = 'block';
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const err = document.getElementById('errMsg');
    err.style.display = 'none';

    const user = DB.findUserByEmail(email);
    if(!user || user.password !== password){
      err.textContent = 'Incorrect email or password. Please try again.';
      err.style.display = 'block';
      return;
    }
    DB.login(user.id);
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
