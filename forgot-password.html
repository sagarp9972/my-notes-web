<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyNotes — Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand"><div class="mark">📝</div><h1>MyNotes</h1></div>
    <div class="auth-heading">
      <h2>Forgot Password</h2>
      <p>Enter your registered details to verify your identity.</p>
    </div>

    <div class="error-msg" id="errMsg"></div>
    <div class="success-msg" id="okMsg"></div>

    <form id="verifyForm">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="fullName" required placeholder="Your full name">
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Mobile Number</label>
        <input type="tel" id="phone" required placeholder="10-digit mobile number">
      </div>
      <button type="submit" class="btn btn-primary">Verify</button>
    </form>

    <form id="resetForm" class="hidden">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="newPassword" required placeholder="Min. 6 characters">
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" id="confirmNewPassword" required placeholder="Re-enter new password">
      </div>
      <button type="submit" class="btn btn-sage btn-block">Reset Password</button>
    </form>

    <p class="auth-foot">Remember your password? <a href="index.html">Back to Login</a></p>
  </div>
</div>

<script src="js/db.js"></script>
<script>
  let matchedUser = null;

  document.getElementById('verifyForm').addEventListener('submit', function(e){
    e.preventDefault();
    const err = document.getElementById('errMsg');
    err.style.display = 'none';

    const name = document.getElementById('fullName').value.trim().toLowerCase();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();

    const user = DB.findUserByEmail(email);
    if(!user || user.name.toLowerCase() !== name || user.phone !== phone){
      err.textContent = 'We could not verify your details. Please check and try again.';
      err.style.display = 'block';
      return;
    }

    matchedUser = user;
    document.getElementById('verifyForm').classList.add('hidden');
    document.getElementById('resetForm').classList.remove('hidden');
    const ok = document.getElementById('okMsg');
    ok.textContent = 'Identity verified. Set a new password below.';
    ok.style.display = 'block';
  });

  document.getElementById('resetForm').addEventListener('submit', function(e){
    e.preventDefault();
    const err = document.getElementById('errMsg');
    err.style.display = 'none';

    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('confirmNewPassword').value;

    if(p1.length < 6){
      err.textContent = 'Password must be at least 6 characters.';
      err.style.display = 'block';
      return;
    }
    if(p1 !== p2){
      err.textContent = 'Passwords do not match.';
      err.style.display = 'block';
      return;
    }

    DB.updateUser(matchedUser.id, { password: p1 });
    window.location.href = 'index.html?reset=1';
  });
</script>
</body>
</html>
